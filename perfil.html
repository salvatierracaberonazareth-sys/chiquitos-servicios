</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">⚙️ <span>Chiquitos</span>Técnicos</a>

                    <li><a href="index.html">Inicio</a></li>

    <main class="container" style="max-width: 800px; padding: 2rem 1rem;">

        <!-- ESTE CONTENEDOR DEBE ESTAR VACÍO PARA QUE JS PINTE LOS DATOS CORRECTAMENTE -->
        <div id="perfil-detalle-container">
            <div style="text-align: center; padding: 3rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

    <!-- Modal para zoom de fotos -->

    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarDetallePerfil();
        });
